name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze source
        uses: github/codeql-action/analyze@v4

  dependency-audit:
    name: npm and Rust vulnerability audits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Audit production JavaScript dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Install RustSec audit tool
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Block vulnerable dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          retry-on-snapshot-warnings: true
