[package]
name = "atmosphere-desktop"
version = "1.0.0"
description = "Atmosphere ambient sound and cinematic focus player"
authors = ["Atmosphere"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "atmosphere_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
